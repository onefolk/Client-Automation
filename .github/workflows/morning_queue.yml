name: OneFolk Autonomous Morning Queue
on:
  schedule:
    # Sunday-Thursday 22:00 IST; retries/reserve batches at 00:47 and 04:47 IST.
    - cron: '30 16 * * 0-4'
    - cron: '17 19,23 * * 0-4'
    # Final bounded replenishment at 06:47 IST; readback at 08:30 IST Mon-Fri.
    - cron: '17 1 * * 1-5'
    - cron: '0 3 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onefolk-production-sheet-writer
  cancel-in-progress: false
jobs:
  queue:
    if: github.repository == 'Giridharan-E/Client-Automation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: scraper
    timeout-minutes: 12
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      ENABLE_SENDING: 'false'
      SCHEDULE_SLOT: ${{ github.event.schedule || github.run_id }}
      MAX_AI_CALLS: '30'
      MAX_HTTP_FETCHES: '160'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify credentials, discover, research, draft, synchronize, then read back
        shell: bash
        run: |
          if [ "$SCHEDULE_SLOT" = '0 3 * * 1-5' ]; then
            python -m src.cli preflight --no-groq
            python -m src.cli morning-queue --target 50 --publish-only
          else
            python -m src.cli preflight
            python -m src.cli morning-queue --target 50
          fi
      - name: Failure is visible; independent Apps Script watchdog checks the heartbeat
        if: failure()
        run: echo '::error::Morning queue incomplete. Check credentials, quotas, source yield and Sheet writes. No readiness claim was made.'
