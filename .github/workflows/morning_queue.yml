name: OneFolk Autonomous Morning Queue
on:
  schedule:
    # Sunday-Thursday 21:53 IST; retries/reserve batches at 00:47 and 04:47 IST.
    - cron: '23 16 * * 0-4'
    - cron: '17 19,23 * * 0-4'
    # Final bounded replenishment at 06:47 IST; readback at 08:53 IST Mon-Fri.
    - cron: '17 1 * * 1-5'
    - cron: '23 3 * * 1-5'
  # Manual run for testing or a targeted client search: Actions > this workflow > Run workflow.
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = find, verify and draft; publish-only = re-check the queue; preflight = test credentials only'
        type: choice
        options: [full, publish-only, preflight]
        default: full
      lane:
        description: 'Which businesses to look for'
        type: choice
        options: [all, no-website, website]
        default: all
      city:
        description: 'Limit discovery and research to one city'
        type: choice
        options: [all, Bengaluru, Mumbai, Delhi NCR, Hyderabad, Pune, Chennai, Kolkata, Ahmedabad, Jaipur, Kochi,
                  Coimbatore, Chandigarh, Lucknow, Indore, Nagpur, Surat, Goa, Thiruvananthapuram, Visakhapatnam,
                  Bhubaneswar, Mysuru, Vadodara]
        default: all
      industry:
        description: 'Limit discovery and research to one industry'
        type: choice
        options: [all, education, training, events, hospitality, restaurant, professional-services, creative,
                  architecture, retail, healthcare, real-estate, wellness, wedding, manufacturing, logistics-travel,
                  startup-tech, automotive, nonprofit, finance, other]
        default: all
      target:
        description: 'Priority drafts to aim for (1-50)'
        type: number
        default: 10
      no_site_searches:
        description: 'Serper searches this run may spend verifying no-website leads (0-100, separate from the nightly budget)'
        type: number
        default: 15
permissions:
  contents: read
concurrency:
  group: onefolk-production-sheet-writer
  cancel-in-progress: false
jobs:
  queue:
    if: (github.repository == 'onefolk/Client-Automation' || github.repository == 'Giridharan-E/Client-Automation') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: scraper
    timeout-minutes: 18
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL || '@cf/openai/gpt-oss-120b' }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      ENABLE_SENDING: 'false'
      SCHEDULE_SLOT: ${{ github.event.schedule || github.run_id }}
      MAX_AI_CALLS: '30'
      MAX_HTTP_FETCHES: '160'
      # Manual-run choices; scheduled runs leave them empty and search everything.
      RUN_MODE: ${{ inputs.mode || 'scheduled' }}
      RUN_TARGET: ${{ inputs.target || 10 }}
      LEAD_LANE: ${{ inputs.lane || 'all' }}
      CAMPAIGN_CITIES: ${{ inputs.city != 'all' && inputs.city || '' }}
      CAMPAIGN_INDUSTRIES: ${{ inputs.industry != 'all' && inputs.industry || '' }}
      NO_SITE_SEARCHES_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.no_site_searches) || 15 }}
      NO_SITE_SEARCHES_PER_DAY: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.no_site_searches) || 30 }}
      NO_SITE_BUDGET_SCOPE: ${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || 'scheduled' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify credentials, discover, research, draft, synchronize, then read back
        shell: bash
        run: |
          echo "Run: mode=$RUN_MODE lane=$LEAD_LANE city=${CAMPAIGN_CITIES:-all} industry=${CAMPAIGN_INDUSTRIES:-all} target=$RUN_TARGET"
          if [ "$RUN_MODE" = 'preflight' ]; then
            python -m src.cli preflight
            exit $?
          fi
          if [ "$SCHEDULE_SLOT" = '23 3 * * 1-5' ] || [ "$RUN_MODE" = 'publish-only' ]; then
            python -m src.cli preflight --no-groq
            CMD="python -m src.cli morning-queue --target $RUN_TARGET --publish-only"
          else
            python -m src.cli preflight
            CMD="python -m src.cli morning-queue --target $RUN_TARGET"
          fi

          echo "::group::Executing Morning Queue Orchestration"
          EXIT_CODE=0
          $CMD || EXIT_CODE=$?
          echo "::endgroup::"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "::notice::Morning queue completed with status READY. Target fully achieved!"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "::warning::Batch completed with an honest SHORTFALL. Strict quality bar preserved; scheduled reserve runs will continue replenishing."
            exit 0
          else
            echo "::error::Morning queue encountered an unexpected error (exit code $EXIT_CODE). Check logs above."
            exit $EXIT_CODE
          fi
      - name: Failure is visible; independent Apps Script watchdog checks the heartbeat
        if: failure()
        run: echo '::error::Morning queue encountered a fatal crash. Inspect the persisted heartbeat and workflow logs.'
